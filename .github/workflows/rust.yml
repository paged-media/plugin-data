name: rust
on:
  push:
    branches: [main]
  # Pre-merge gate: a PR that breaks the engine goes red BEFORE it lands
  # (this lane used to run on push to main only).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Each guard fails explicitly. They used to be two `! (… | grep …)`
      # lines: bash's errexit ignores a `!`-negated command, so only the LAST
      # line's status reached the step and the data-expr guard could never
      # fail.
      - name: dependency guards (spec §4 rules)
        run: |
          if cargo tree -p data-expr --edges normal | grep -E 'data-(sources|query|bind|lower|js)'; then
            echo "LEAK: data-expr depends on a sources/query/bind/lower/js crate"; exit 1
          fi
          if cargo tree -p data-js --target wasm32-unknown-unknown | grep -E 'data-conformance|proptest'; then
            echo "LEAK: the wasm tree pulls a test-only crate"; exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # A red test FAILS this job. The step used to end in `|| true` (so red
      # results would still ship as evidence), which also meant the Rust lane
      # could never go red. Evidence still ships: the coverage gate and the
      # JUnit upload below run under `!cancelled()`.
      - name: nextest (junit)
        run: cargo nextest run --workspace --profile ci --no-fail-fast
      # The §12.2 invariant, both halves: every `implemented` registry row
      # names a test that exists, AND (with --junit) that test ran in the
      # nextest run above and passed. An #[ignore]d skeleton or a red test is
      # a gap, not coverage.
      - name: coverage gate (the §12.2 verification invariant)
        if: ${{ !cancelled() }}
        run: cargo run -p data-conformance --bin coverage-gate -- --junit target/nextest/ci/junit.xml
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-data,
      # suite=nextest, format=nextest-junit).
      - name: upload nextest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 14

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      - name: build + budget gate (100 MB app-wide)
        run: bash scripts/build-wasm.sh
