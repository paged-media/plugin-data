name: vitest
on:
  push:
    branches: [main]
  # Pre-merge gate: a PR that breaks the bundle goes red BEFORE it lands
  # (this lane used to run on push to main only).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      # The plugin contract comes from npm (exact pins, test/sdk-pin.spec.ts);
      # the sibling plugin-sdk checkout this lane used to make for a `link:`
      # chain is no longer read by anything.
      - uses: actions/checkout@v4
        with:
          path: plugin-data
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ------------------------------------------------------------------
      # REAL-ENGINE artifact (audit P4). This lane used to run vitest with
      # no wasm artifact, so data-bundle's engine-real.spec.ts skipIf gate
      # skipped the real boot on EVERY CI — every other bundle test runs
      # against fake hosts/engines. Build it here (the exact recipe of
      # rust.yml's `wasm` job: pinned toolchain, Cargo.lock-pinned
      # wasm-bindgen-cli, pinned binaryen) so the real boot actually runs;
      # REQUIRE_REAL_ENGINE=1 below makes a missing artifact FAIL, not skip.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin-data
      - name: install pinned wasm-bindgen-cli (Cargo.lock version)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' plugin-data/Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: install pinned binaryen (reftypes-safe; old apt binaryen breaks externref table grow)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_119/bin" >> "$GITHUB_PATH"
      - name: build the engine wasm artifact (100 MB app wasm budget gate)
        run: bash plugin-data/scripts/build-wasm.sh
      # Fail-not-skip belt at the JOB level too: a missing artifact reddens
      # the job HERE, before any spec can skip.
      - name: real-engine artifact guard (fail, never skip)
        run: test -f plugin-data/packages/data-bundle/bin/data_js_bg.wasm
      # The real query engine. DuckDB-WASM is vendored by this script (MIT,
      # prebuilt, never compiled in-tree), which also stages the eh variant
      # as the governed bin/duckdb-engine.wasm. REQUIRE_REAL_DUCKDB=1 below
      # turns every "DuckDB not vendored" skip into a failure.
      - name: install
        run: pnpm install --frozen-lockfile --dir plugin-data
      # after install: vendor-duckdb.sh bundles the DuckDB JS API with the
      # installed apache-arrow (scripts/bundle-duckdb-api.mjs)
      - name: vendor DuckDB-WASM (MIT prebuilt)
        run: bash plugin-data/scripts/vendor-duckdb.sh
      - name: real-DuckDB artifact guard (fail, never skip)
        run: test -f plugin-data/packages/data-bundle/bin/duckdb-engine.wasm
      # ------------------------------------------------------------------
      - name: contract-import lint (fail fast)
        run: node plugin-data/scripts/check-contract-imports.mjs
      - name: typecheck
        run: pnpm -r --dir plugin-data typecheck
      # A red spec FAILS this job. It used to end in `|| true` (so red
      # results would still be published as evidence), which also meant the
      # TS lane could never go red: a failing spec merged green. Evidence
      # still ships: the JUnit steps below run under `!cancelled()`.
      - name: vitest (junit per package)
        env:
          # The spec-level half of the dual gate (engine-real.spec.ts,
          # wasm-fresh.spec.ts): under this env a missing artifact FAILS the
          # suite instead of letting the skipIf gate silently pass a vacuous
          # run. REQUIRE_REAL_DUCKDB does the same for the DuckDB specs.
          REQUIRE_REAL_ENGINE: "1"
          REQUIRE_REAL_DUCKDB: "1"
          REQUIRE_REAL_CORE: "1"
        run: |
          pnpm -r --no-bail --dir plugin-data exec \
            vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: collect junit
        if: ${{ !cancelled() }}
        run: |
          cat plugin-data/packages/*/junit.xml > junit-all.xml
          [ -s junit-all.xml ]
      # Evidence hand-off, INVERTED (2026-07-25). This step used to call
      # paged-media/state/actions/publish-results@main, but that action lives in the
      # PRIVATE paged-media/state repo, and GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found") — so the job died at SET-UP, before any step
      # ran, and this lane never published a single result. Follow the inverted
      # pattern core/ci.yml and plugin-doc use: upload the results as an artifact
      # and let state PULL it (private state can read a public repo's artifacts).
      # Consumer: state/.github/workflows/siblings-pull.yml (source=plugin-data,
      # suite=vitest, format=nextest-junit).
      - name: upload vitest results artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: junit-all.xml
          if-no-files-found: error
          retention-days: 14
