# paged.data feature registry — plugin integration (spec §2, §12.3
# data.plugin.*). The bundle/manifest/panels rows are vitest-gated and land
# with the TS bundle (data.plugin.bundle added alongside the bundle tests).

- id: data.plugin.payload-roundtrip
  title: Binding recipe (sources + queries + binding defs) round-trips losslessly
  spec: plugin-data data-js/src/core.rs (base-idea §5.1, §12.4)
  status: implemented
  provenance: ["serialize -> deserialize -> rebuild identical; credentials absent"]
  tests:
    rust: ["data-conformance/tests/roundtrip.rs::data_plugin_payload_roundtrip"]

- id: data.plugin.persistence
  title: The data session survives save and reopen (the paged.data/session container part)
  spec: plugin-data packages/data-bundle/src/{persist,session}.ts + data-js/src/core.rs (load_payload)
  status: implemented
  provenance: ["load_payload replaces the recipe in place; re-definitions upsert by id; the session part round-trips through a real .paged save + reopen (real core, data-js, DuckDB)"]
  tests:
    rust:
      - "data-conformance/tests/roundtrip.rs::data_plugin_load_payload_in_place__feat__data_plugin_persistence"
      - "data-conformance/tests/roundtrip.rs::data_plugin_redefine_replaces_in_the_payload__feat__data_plugin_persistence"
    vitest: ["packages/data-bundle/test/persist-real-core.spec.ts"]

- id: data.plugin.bundle
  title: paged.data bundle (media.paged.data) — manifest + activate + panels
  spec: plugin-data packages/data-bundle (base-idea §2)
  status: implemented
  provenance: ["manifest validates via plugin-cli; activate registers panels + commands; loadBundle honesty tests"]
  tests:
    vitest: ["packages/data-bundle/src/__tests__/activate.test.ts"]
