# paged.data feature registry — binding + synchronization engine (spec §8,
# §12.3 data.bind.*).

- id: data.bind.resolve-variable
  title: Resolve a variable binding (expression over a record -> formatted value)
  spec: plugin-data data-bind/src/lib.rs (base-idea §9.1)
  status: implemented
  provenance: ["own code; eval via data-expr"]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_resolve_variable"]

- id: data.bind.preview-step
  title: Record-preview stepper — resolve a binding against a chosen record index N (§9)
  spec: plugin-data data-bind/src/lib.rs (base-idea §9 record-preview affordance)
  status: implemented
  provenance:
    [
      "resolve_at(binding, record) evaluates per-record kinds (variable/image/barcode) over records[record] instead of always row 0; resolve()=resolve_at(0); record_count(query) is the stepper's of-N bound; an out-of-range index degrades to the missing policy (no panic); whole-result kinds (table/flow) ignore the index and render in full; the SAME resolve+lower lanes the batch uses, so preview == output",
      "bundle: session.recordCount(query) + session.previewRecord(binding, record) drive a prev/next/jump stepper in the bindings panel; previewRecord commits through the normal lower lanes (variable field re-set, image place, barcode re-encode via lower_barcode_at) and falls back to the record-0 resolve on an engine wasm predating the lane",
    ]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_preview_step_record"]
    vitest: ["packages/data-bundle/src/__tests__/preview.test.ts"]

- id: data.bind.field-mapping
  title: Field-mapping wizard — map the source's columns → variable bindings one-click (§9)
  spec: plugin-data data-bind/src/mapping.rs + data-expr/src/lib.rs (is_field_ident) (base-idea §9 first-run import affordance)
  status: implemented
  provenance:
    [
      "suggest_mappings(schema) is a pure schema -> ColumnMapping[] kernel: one row per result column with a humanised header (unit_price -> Unit Price), the bound expression = the bare field reference, the logical type hint, and a mappable flag; mappability is data-expr::is_field_ident (the DSL grammar mirror) — the DSL has NO quoted/bracketed field syntax, so a column whose name is not a bare identifier (space/punctuation/leading digit/reserved TRUE/FALSE/NULL) is flagged non-mappable with an empty expr (the wizard asks for a manual expression, never invents a quoting grammar)",
      "bundle: session.queryMappings(query) returns the suggestions; the field-mapping wizard panel renders the header -> binding mapping UI and, on confirm, generates each variable binding from the engine-computed expr (the data semantics stay in Rust; the bundle never decides the mapping)",
    ]
  tests:
    rust: ["data-conformance/tests/mapping.rs::data_bind_field_mapping"]
    vitest: ["packages/data-bundle/src/__tests__/mapping.test.ts"]

- id: data.bind.resolve-table
  title: Resolve a single-region dynamic table (per-record column expressions)
  spec: plugin-data data-bind/src/lib.rs (base-idea §9.3)
  status: implemented
  provenance: ["own code; stabilised record order"]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_resolve_table"]

- id: data.bind.sync-states
  title: Sync states (Linked/Pinned/Overridden/Stale/Error) — non-destructive refresh
  spec: plugin-data data-bind/src/lib.rs (base-idea §8, D-6)
  status: implemented
  provenance: ["refresh never clobbers pinned/overridden; sync report"]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_sync_states"]

- id: data.bind.identity-diff
  title: Record-identity stable diff (minimal insert/update/remove deltas)
  spec: plugin-data data-bind/src/diff.rs (base-idea §8)
  status: implemented
  provenance: ["declared-key diff; minimal deltas keep pagination stable"]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_identity_diff"]

- id: data.bind.change-report
  title: Change-highlighting on refresh — per-binding "what changed since last sync" report (§8)
  spec: plugin-data data-bind/src/diff.rs + data-js/src/core.rs (base-idea §8)
  status: implemented
  provenance:
    [
      "resolved_fingerprint(&Resolved) is a pure, locale-free, type-tagged identity of a binding's resolved content (the host-committed display: variable display+hidden, table grid, flow instances, image ref+status, barcode value+status); diff_resolved(before, after) compares two id->fingerprint snapshots into a ChangeReport (per-binding changed/unchanged/added/removed + rolled-up counts); resolve_content(id, record) is the read-only resolve core (does NOT mutate sync state) that fingerprint_all() snapshots over",
      "data-js: DataSession.refresh_change_report() holds the last fingerprint snapshot, diffs current vs prior, updates it (first call = baseline added); does not drive the sync-state machine (it reports the delta, never clobbers); bundle session.refreshDiff() returns the report the panel renders as a change list",
    ]
  tests:
    rust: ["data-conformance/tests/bind.rs::data_bind_change_report"]
    vitest: ["packages/data-bundle/src/__tests__/change-report.test.ts"]

- id: data.bind.invalidation
  title: ResolveStamp invalidation (only the affected cut goes stale)
  spec: plugin-data data-bind/src/lib.rs (base-idea §8)
  status: implemented
  provenance:
    [
      "content-hash keyed; same data -> no invalidation; the cut is dependency-scoped per query (set_result marks only the bindings whose query() == the changed query) — a single-source change never triggers a whole-set recompute (cross-query cut proven)",
    ]
  tests:
    rust:
      - "data-conformance/tests/bind.rs::data_bind_invalidation"
      - "data-conformance/tests/bind.rs::data_bind_invalidation_cross_query_cut"

- id: data.bind.recordflow
  title: Resolve a record flow — grouped template instances in stable order (§9.4)
  spec: plugin-data data-bind/src/lib.rs (base-idea §9.4)
  status: implemented
  provenance: ["one template instance per record; group-by sectioning; measured atomic heights"]
  tests:
    rust: ["data-conformance/tests/recordflow.rs::data_bind_record_flow"]

- id: data.bind.recordflow-nested
  title: Record-flow multi-level nested grouping — hierarchical section headers (§9.4)
  spec: plugin-data data-bind/src/lib.rs (base-idea §9.4 advanced presentation grouping)
  status: implemented
  provenance:
    [
      "group_by [a,b,...] nests: parent levels are header-only sections preceding their leaf sections; each carries a `level` (0=outermost) for host indent/style; single-level/ungrouped unchanged (level 0); driven off the resolved key so a missing group column degrades to one section",
    ]
  tests:
    rust: ["data-conformance/tests/recordflow.rs::data_bind_record_flow_nested"]

- id: data.bind.recordflow-footer
  title: Record-flow section footers — per-group subtotal/count rows (§9.4)
  spec: plugin-data data-bind/src/lib.rs + data-lower/src/lib.rs (base-idea §9.4 "section headers/footers")
  status: implemented
  provenance:
    [
      "GroupFooter spec ({count} substitution + an agg of sum_field: sum/avg/min/max, locale-aware); resolve accumulates per group from RAW values; paginate emits an atomic GroupFooter block at the group end",
    ]
  tests:
