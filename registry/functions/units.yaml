# paged.data expression functions — units family (ADR 558 §3). A length is a
# NUMBER in points, so it composes with math and logic. `AS` is the explicit
# form of the coercion a property binding applies against its target schema.
# One row per function; build-consumed (data-core/build.rs + data-expr/build.rs).

- id: data.expr.units.mm
  name: MM
  family: units
  arity: { min: 1, max: 1 }
  rust: units::mm
  status: implemented
  provenance: ["ADR 558 §3; 72 pt per inch, 25.4 mm per inch; own code"]
  tests:
    rust: ["data-conformance/tests/property.rs::units_convert_to_points__feat__data_bind_property"]

- id: data.expr.units.cm
  name: CM
  family: units
  arity: { min: 1, max: 1 }
