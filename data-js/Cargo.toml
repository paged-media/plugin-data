[package]
name = "data-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.data wasm-bindgen surface (spec §4): the DataEngine the bundle consumes, a thin shim over the plain-Rust DataSession (load source manifest, define queries/bindings, ingest results, resolve, lower, sync, round-trip). crate-type cdylib for the wasm artifact."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
data-core = { path = "../data-core" }
data-sources = { path = "../data-sources" }
data-bind = { path = "../data-bind" }
data-lower = { path = "../data-lower" }
data-barcode = { path = "../data-barcode" }
data-dataset = { path = "../data-dataset" }
data-query = { path = "../data-query" }
data-automation = { path = "../data-automation" }
data-xlsx = { path = "../data-xlsx" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[features]
# The engine work counters (data-query/src/perf.rs) behind `perfCounters()`.
# ON by default, so the shipped wasm and the perf budgets measure the same
# artifact. Measured 2026-10-05 (docs/design/perf-baseline-2026-10-05.md):
# +404 bytes of wasm (0.06 %), and a 10k-row table resolve in wasm at
# 30.5–31.1 ms on vs 30.7 ms off — inside the noise. Natively the counters
# cost 2–5 % on the criterion benches, which is why the CRATES keep them off by
# default and only this boundary crate turns them on.
default = ["perf-counters"]
perf-counters = ["data-bind/perf-counters", "data-query/perf-counters"]
